<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arttemism - Mercado das Bruxas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --preto:#000;
  --roxo:#7b2fbf;
  --roxo-claro:#b57bee;
  --roxo-fundo:#170a26;
  --laranja:#ff8a1f;
  --laranja-fundo:#2a1503;
  --texto:#e9dff5;
  --apagado:#9a88b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--preto)}
body{
  background:var(--preto);color:var(--texto);
  font-family:"IM Fell English",Georgia,serif;font-size:1.1rem;line-height:1.6;
  min-height:100vh;
}
:focus-visible{outline:2px solid var(--laranja);outline-offset:3px}
.pagina{max-width:1080px;margin:0 auto;padding:0 20px 80px}

header{text-align:center;padding:64px 0 36px;border-bottom:1px solid var(--roxo)}
.lua{
  width:74px;height:74px;border-radius:50%;margin:0 auto 18px;
  background:radial-gradient(circle at 34% 34%,#ffc27a,var(--laranja) 60%,#a34d00);
  box-shadow:0 0 34px 6px rgba(255,138,31,.45),0 0 90px 24px rgba(123,47,191,.35);
}
h1{
  font-family:"Pirata One","Old English Text MT",serif;font-weight:400;
  font-size:clamp(3.4rem,12vw,7rem);line-height:1;letter-spacing:.03em;
  color:var(--laranja);text-shadow:0 0 22px rgba(255,138,31,.45),3px 3px 0 var(--roxo);
}
.lema{margin:16px auto 0;max-width:34em;color:var(--roxo-claro);font-style:italic}

.ferramentas{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:32px 0 8px}
.busca{
  flex:1 1 240px;background:var(--roxo-fundo);border:1px solid var(--roxo);color:var(--texto);
  font:inherit;padding:10px 14px;border-radius:2px;
}
.busca::placeholder{color:var(--apagado)}
.abas{display:flex;flex-wrap:wrap;gap:8px}
.aba{
  background:transparent;border:1px solid var(--roxo);color:var(--roxo-claro);
  font:inherit;padding:8px 14px;cursor:pointer;border-radius:2px;
  transition:background .2s,color .2s,border-color .2s;
}
.aba:hover{background:var(--roxo-fundo)}
.aba[aria-pressed="true"]{background:var(--laranja);border-color:var(--laranja);color:#000}
.status{color:var(--apagado);font-style:italic;min-height:1.6em;margin-bottom:6px}

section{margin-top:44px}
section h2{
  font-family:"Pirata One",serif;font-weight:400;font-size:2.1rem;
  color:var(--roxo-claro);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
section h2 small{font-family:"IM Fell English",serif;font-size:1rem;color:var(--apagado);font-style:italic}
section.principal h2{font-size:2.8rem;color:var(--laranja)}
.grade{display:grid;gap:16px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
section.principal .grade{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

.item{
  background:var(--roxo-fundo);border:1px solid var(--roxo);border-left:5px solid var(--roxo);
  padding:16px 18px;display:flex;flex-direction:column;gap:6px;
}
section.principal .item{background:var(--laranja-fundo);border-color:#7a3d00;border-left-color:var(--laranja)}
.item h3{font-family:"Pirata One",serif;font-weight:400;font-size:1.5rem;line-height:1.15}
.desc{color:var(--apagado);font-size:.98rem}
.preco{font-family:"Pirata One",serif;font-size:1.9rem;color:var(--laranja);margin-top:auto}
.dados{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.95rem}
.dados dt{color:var(--apagado)}
.selo{display:inline-block;padding:2px 10px;border:1px solid;font-size:.9rem;width:fit-content}
.selo.ok{color:var(--roxo-claro);border-color:var(--roxo)}
.selo.alerta{color:var(--laranja);border-color:var(--laranja)}
.selo.morto{color:#ff5d5d;border-color:#ff5d5d;text-decoration:line-through wavy}
.vazio{padding:40px 0;text-align:center;color:var(--apagado);font-style:italic}
footer{margin-top:70px;padding-top:22px;border-top:1px solid var(--roxo);text-align:center;color:var(--apagado);font-size:.95rem}

@media (prefers-reduced-motion:no-preference){
  .lua{animation:pulsar 5s ease-in-out infinite}
  @keyframes pulsar{50%{box-shadow:0 0 44px 10px rgba(255,138,31,.6),0 0 110px 30px rgba(123,47,191,.45)}}
}
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div class="lua" aria-hidden="true"></div>
    <h1>Arttemism</h1>
    <p class="lema">Comida para o corpo, velas para a alma. Todo pão é abençoado, mas confira a validade antes do ritual.</p>
  </header>

  <div class="ferramentas">
    <input class="busca" id="busca" type="search" placeholder="Invocar um produto pelo nome..." aria-label="Buscar produto">
    <div class="abas" id="abas"></div>
  </div>
  <p class="status" id="status" role="status">Acendendo as velas...</p>

  <main id="lista"></main>

  <footer>Arttemism, projeto de Banco de Dados. Nenhum gato preto foi ferido na produção deste estoque.</footer>
</div>

<script>
// ============ CONFIGURAÇÃO DO SUPABASE ============
// Pegue a chave em: Project Settings > API > "anon public"
const SUPABASE_URL = "https://btqsubtnvlztypbbqqtf.supabase.co";
const SUPABASE_KEY = "COLE_AQUI_SUA_ANON_KEY";
const TABELA = "tabela_do_produto";
// ==================================================

// Comida vem primeiro (prioridade)
const CATEGORIAS = [
  {id:"comida",         nome:"Banquete das Bruxas",    nota:"prioridade máxima"},
  {id:"vela",           nome:"Velas e Chamas"},
  {id:"incenso",        nome:"Incensos e Fumaças"},
  {id:"oleo_essencial", nome:"Óleos Essenciais"},
  {id:"esoterico",      nome:"Ervas, Cristais e Afins"}
];

// Dados de exemplo, usados se a chave ainda não foi colocada
const DEMO = [
  {id:1,produto:"Pão Francês",categoria:"comida",descricao:"Pão fresco, sem maldição",peso:0.05,valor:0.8,quantidade_estoque:200,data_de_fabricacao:"2026-09-24",data_de_validade:"2026-09-26",fornecedor:"Padaria Central",lote:"L001"},
  {id:2,produto:"Massa de Bolo Baunilha",categoria:"comida",descricao:"Massa pronta de bolo",peso:0.4,valor:7.5,quantidade_estoque:60,data_de_fabricacao:"2026-09-01",data_de_validade:"2026-12-01",fornecedor:"Doces & Cia",lote:"L002"},
  {id:3,produto:"Vela Preta de Proteção",categoria:"vela",descricao:"Vela ritualística de cera vegetal",peso:0.12,valor:14.9,quantidade_estoque:80,data_de_fabricacao:"2026-08-01",fornecedor:"Ateliê Lunar",lote:"V001"},
  {id:4,produto:"Incenso de Sândalo",categoria:"incenso",descricao:"Caixa com 20 varetas",peso:0.05,valor:9.9,quantidade_estoque:150,data_de_fabricacao:"2026-07-15",data_de_validade:"2028-07-15",fornecedor:"Fumaça Sagrada",lote:"I001"},
  {id:5,produto:"Óleo Essencial de Lavanda",categoria:"oleo_essencial",descricao:"Frasco conta-gotas",ml:10,valor:29.9,quantidade_estoque:45,data_de_fabricacao:"2026-06-10",data_de_validade:"2028-06-10",fornecedor:"Botica das Ervas",lote:"O001"},
  {id:6,produto:"Cristal Ametista Bruta",categoria:"esoterico",descricao:"Pedra bruta para meditação",peso:0.08,valor:24,quantidade_estoque:30,fornecedor:"Pedras da Lua",lote:"E001"}
];

let produtos = [];
let categoriaAtual = "todas";

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dinheiro = v => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num = v => Number(v).toLocaleString("pt-BR",{maximumFractionDigits:3});
const dataBR = d => d ? new Date(d + "T00:00:00").toLocaleDateString("pt-BR") : "sem data";

function medida(p){
  const partes = [];
  if (p.peso != null)   partes.push(num(p.peso) + " kg");
  if (p.litro != null)  partes.push(num(p.litro) + " L");
  else if (p.ml != null) partes.push(num(p.ml) + " ml");
  else if (p.volume != null) partes.push(num(p.volume) + " de volume");
  return partes.join(" / ") || "não informada";
}

function selo(p){
  if (!p.data_de_validade) return `<span class="selo ok">Sem validade</span>`;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = Math.round((new Date(p.data_de_validade + "T00:00:00") - hoje) / 86400000);
  if (dias < 0)  return `<span class="selo morto">Vencido, amaldiçoado</span>`;
  if (dias <= 7) return `<span class="selo alerta">Vence em ${dias} dia${dias === 1 ? "" : "s"}</span>`;
  return `<span class="selo ok">Válido até ${dataBR(p.data_de_validade)}</span>`;
}

function cartao(p){
  return `<article class="item">
    <h3>${esc(p.produto)}</h3>
    ${p.descricao ? `<p class="desc">${esc(p.descricao)}</p>` : ""}
    ${selo(p)}
    <dl class="dados">
      <dt>Medida</dt><dd>${esc(medida(p))}</dd>
      <dt>Estoque</dt><dd>${esc(p.quantidade_estoque ?? 0)} un.</dd>
      <dt>Fabricado</dt><dd>${dataBR(p.data_de_fabricacao)}</dd>
      ${p.fornecedor ? `<dt>Fornecedor</dt><dd>${esc(p.fornecedor)}</dd>` : ""}
      ${p.lote ? `<dt>Lote</dt><dd>${esc(p.lote)}</dd>` : ""}
    </dl>
    <p class="preco">${dinheiro(p.valor)}</p>
  </article>`;
}

function desenhar(){
  const termo = $("#busca").value.trim().toLowerCase();
  const filtrados = produtos.filter(p =>
    (categoriaAtual === "todas" || p.categoria === categoriaAtual) &&
    (!termo || (p.produto || "").toLowerCase().includes(termo))
  );

  let html = "";
  CATEGORIAS.forEach(c => {
    const grupo = filtrados
      .filter(p => p.categoria === c.id)
      .sort((a, b) => (a.data_de_validade || "9999").localeCompare(b.data_de_validade || "9999"));
    if (!grupo.length) return;
    html += `<section class="${c.id === "comida" ? "principal" : ""}">
      <h2>${c.nome} <small>${c.nota ? c.nota + ", " : ""}${grupo.length} ${grupo.length === 1 ? "item" : "itens"}</small></h2>
      <div class="grade">${grupo.map(cartao).join("")}</div>
    </section>`;
  });
  $("#lista").innerHTML = html || `<p class="vazio">Nenhum produto respondeu ao chamado. Tente outro nome ou outra aba.</p>`;
}

function montarAbas(){
  const abas = [{id:"todas", nome:"Tudo"}, ...CATEGORIAS];
  $("#abas").innerHTML = abas.map(a =>
    `<button class="aba" data-cat="${a.id}" aria-pressed="${a.id === categoriaAtual}">${a.nome}</button>`).join("");
  document.querySelectorAll(".aba").forEach(b => b.addEventListener("click", () => {
    categoriaAtual = b.dataset.cat;
    document.querySelectorAll(".aba").forEach(x => x.setAttribute("aria-pressed", x === b));
    desenhar();
  }));
}

async function carregar(){
  montarAbas();
  $("#busca").addEventListener("input", desenhar);

  if (SUPABASE_KEY.startsWith("COLE_AQUI")) {
    produtos = DEMO;
    $("#status").textContent = "Modo demonstração: cole sua anon key no script para ler o estoque real do Supabase.";
    return desenhar();
  }
  try {
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data, error } = await db.from(TABELA).select("*");
    if (error) throw error;
    produtos = data || [];
    $("#status").textContent = `${produtos.length} produtos no grimório.`;
  } catch (e) {
    console.error(e);
    produtos = DEMO;
    $("#status").textContent = "O feitiço falhou ao falar com o Supabase (veja o console, F12). Mostrando dados de exemplo.";
  }
  desenhar();
}
carregar();
</script>
</body>
</html>
